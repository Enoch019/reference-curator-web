name: Apply Shared Reference Topic
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: shared-topic-edit
  cancel-in-progress: false
jobs:
  apply:
    if: startsWith(github.event.issue.title, '[Curator Web]') || startsWith(github.event.issue.title, '[Curator Profile]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check GitHub editor permission
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ISSUE_AUTHOR/permission" --jq '.permission')"
          case "$permission" in
            admin|write|maintain|push)
              echo "AUTHORIZED_ISSUE_AUTHOR=$ISSUE_AUTHOR" >> "$GITHUB_ENV"
              echo "Authorized editor: $ISSUE_AUTHOR"
              ;;
            *)
              echo "::error::Write permission is required (permission: $permission)"
              exit 1
              ;;
          esac
      - name: Apply topic
        run: python scripts/apply_topic_issue.py "$GITHUB_EVENT_PATH" config.json
      - name: Refresh published topic profiles
        run: python scripts/sync_dashboard_bootstrap.py config.json site/bootstrap.js
      - name: Commit shared settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json site/bootstrap.js
          if ! git diff --cached --quiet; then
            git commit -m "Update shared topics via issue #${{ github.event.issue.number }}"
            git push origin HEAD:main
          fi
      - name: Confirm save
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Saved shared topic settings. The private curator will read the new configuration on its next run."
          gh issue close "$ISSUE_NUMBER"
