name: "Reference Curator — Test Discord Delivery"
description: "Queue a real image-search and Discord test for the selected saved topic."
title: "[Curator Test] "
body:
  - type: markdown
    attributes:
      value: |
        ## Request a real collection test
        이 요청은 **저장된 토픽 설정**으로 이미지 검색 → AI 선별 → Discord 실제 발송을 테스트합니다.
        **저장소에 초대된 협업자만** 실행할 수 있습니다.
        비공개 수집기가 약 15분 간격으로 요청을 확인하며, GitHub 스케줄 지연으로 더 늦어질 수 있습니다.
        반복 제출하면 API 비용 및 Discord 메시지가 추가로 발생할 수 있습니다.
  - type: input
    id: topic
    attributes:
      label: "Topic ID"
      description: "웹사이트에서 선택한 토픽 ID입니다. 변경하지 않는 것을 권장합니다."
      placeholder: "gothic_fantasy_castles"
    validations:
      required: true
