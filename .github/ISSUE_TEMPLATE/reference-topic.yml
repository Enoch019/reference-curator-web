name: "Reference Curator · Topic Profile"
description: "상세한 Art Direction 주제를 생성하거나 수정합니다. 제출 후 GitHub Actions가 설정에 반영합니다."
title: "[Curator Profile] "
body:
  - type: markdown
    attributes:
      value: |
        ## Reference Curator — Art Direction Profile
        Discord 봇은 필요 없습니다. 이 양식을 제출하면 GitHub Actions가 `config.json`을 갱신합니다.
        주제 ID가 동일하면 기존 주제를 덮어씁니다. 주제마다 ArtStation/Pinterest 검색어를 영어로 작성하세요.
        **비밀키/API 키는 이 양식에 입력하지 마세요.**
  - type: input
    id: topic_id
    attributes:
      label: "Topic ID"
      description: "영문 소문자, 숫자, _ 만 사용. 기존 ID를 넣으면 해당 주제를 수정합니다."
      placeholder: "gothic_fantasy_castles"
    validations:
      required: true
  - type: input
    id: topic_label
    attributes:
      label: "Topic Name"
      description: "Discord의 topic : 뒤에 표시되는 이름"
      placeholder: "중세 성 · 고딕 판타지"
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: "Visual Direction"
      description: "어떤 목적의 레퍼런스인지, 미학·분위기·전체적인 시각적 의도를 상세히 설명"
      placeholder: "실제 중세 성채의 구조적 설득력을 유지하고, 고딕 특유의 수직성과 위압감을 강조한다. 판타지는 절제한다."
    validations:
      required: true
  - type: dropdown
    id: fantasy
    attributes:
      label: "Fantasy Intensity"
      options:
        - "0 - historical realism"
        - "1 - subtle fantasy"
        - "2 - moderate fantasy"
        - "3 - high fantasy"
    validations:
      required: true
  - type: input
    id: period
    attributes:
      label: "Era and Culture"
      placeholder: "12th-15th century Western Europe"
  - type: textarea
    id: architecture
    attributes:
      label: "Architecture and Shapes"
      description: "건축 양식, 실루엣, 구조, 비례 등"
      placeholder: "gothic spires, pointed arches, flying buttresses, stone battlements"
  - type: textarea
    id: materials
    attributes:
      label: "Materials and Details"
      placeholder: "weathered limestone, dark granite, crenellated towers, carved tracery"
  - type: textarea
    id: lighting
    attributes:
      label: "Lighting and Weather"
      placeholder: "overcast dawn, cold fog, muted light"
  - type: input
    id: palette
    attributes:
      label: "Color Palette"
      placeholder: "cold desaturated grays, muted moss greens"
  - type: textarea
    id: include
    attributes:
      label: "Must Include"
      description: "쉼표/줄바꿈으로 구분한 주요 시각 요소"
      placeholder: "stone curtain walls, gothic pointed windows, towering silhouettes"
  - type: textarea
    id: exclude
    attributes:
      label: "Must Avoid"
      description: "보고 싶지 않은 양식·요소·분위기"
      placeholder: "anime, neon cyberpunk, magical particle overload, cartoon"
  - type: textarea
    id: silhouette
    attributes:
      label: "Slot 1 - Silhouette"
      description: "1번 사진의 역할: 형태·비례·지형"
      value: "Wide view of the full castle silhouette, towers and its relationship to the terrain."
    validations:
      required: true
  - type: textarea
    id: architectural_detail
    attributes:
      label: "Slot 2 - Architecture"
      description: "2번 사진의 역할: 구조·재질·모듈러 디테일"
      value: "Close or mid-range study of stone structure, gothic arches, windows, towers and masonry."
    validations:
      required: true
  - type: textarea
    id: atmosphere
    attributes:
      label: "Slot 3 - Atmosphere"
      description: "3번 사진의 역할: 조명·색채·공기감"
      value: "Atmospheric environment reference emphasizing mood, light, fog and scale."
    validations:
      required: true
  - type: textarea
    id: artstation
    attributes:
      label: "ArtStation Queries"
      description: "영어 검색어를 한 줄에 하나씩. 1개 이상."
      placeholder: |
        gothic medieval castle environment concept art
        dark fantasy castle fortress architecture environment art
        gothic citadel castle 3d environment breakdown
    validations:
      required: true
  - type: textarea
    id: pinterest
    attributes:
      label: "Pinterest Queries"
      description: "영어 검색어를 한 줄에 하나씩. 1개 이상."
      placeholder: |
        medieval gothic castle exterior architecture photography
        gothic castle stone towers architecture reference
        medieval fortress fog photography
    validations:
      required: true
  - type: dropdown
    id: strictness
    attributes:
      label: "Vision Strictness"
      description: "높을수록 시각적 조건에 맞지 않는 작품을 엄격하게 제외합니다."
      options:
        - "balanced"
        - "strict"
        - "relaxed"
    validations:
      required: true
  - type: dropdown
    id: activate
    attributes:
      label: "Activate Now"
      description: "Yes이면 매시간 자동 수집하는 주제로 즉시 변경"
      options:
        - "Yes"
        - "No"
    validations:
      required: true
